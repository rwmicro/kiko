# Réglages lus par la CLI Supabase au déploiement des fonctions (supabase functions deploy).
# push et reminders ne sont appelées que par la base, avec le secret rangé dans Vault :
# elles ne demandent pas de jeton d'utilisateur.
project_id = "kiko"

[functions.push]
verify_jwt = false

[functions.reminders]
verify_jwt = false

# delete-account vérifie elle-même le jeton de la personne (ou le secret de la base, pour le ménage de nuit).
[functions.delete-account]
verify_jwt = false

# livekit-token vérifie elle-même le jeton de la personne, comme delete-account.
[functions.livekit-token]
verify_jwt = false
