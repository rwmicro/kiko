# Configuration de la Supabase locale (supabase start) et des réglages d'authentification
# que l'on veut identiques en test et en production. Doc : https://supabase.com/docs/guides/local-development/cli/config
project_id = "kiko"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Retour d'une connexion Apple ou Google faite dans le navigateur (Android, et Google sur iPhone).
additional_redirect_urls = ["kiko://login"]
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

# Connexion avec Apple et Google (voir docs/connexion-apple-google.md).
# Coupés en local par défaut ; sur les projets hébergés, ils s'activent dans le tableau de bord Supabase.
# Pour les essayer en local : enabled = true, et les variables d'environnement au lancement de `supabase start`.
[auth.external.apple]
enabled = false
# ID de services (connexion web, Android) puis identifiant du bundle iOS (connexion native).
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_IDS)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
skip_nonce_check = false

[auth.external.google]
enabled = false
# ID client « Application Web » d'abord ; les ID Android et iOS peuvent suivre, séparés par des virgules.
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_IDS)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false
# Fonctions Edge. push et reminders ne sont appelées que par la base, avec le secret rangé dans Vault ;
# delete-account vérifie elle-même le jeton de la personne (ou le secret de la base, pour le ménage de nuit).
[functions.push]
verify_jwt = false

[functions.reminders]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
