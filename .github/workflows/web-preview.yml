name: Web preview

# Compile l'aperçu web (WebAssembly) et le publie sur la branche `web-preview`,
# d'où il peut être affiché dans Claude ou servi par GitHub Pages.
on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build the web preview
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace
      - name: Push to the web-preview branch
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd composeApp/build/dist/wasmJs/productionExecutable
          touch .nojekyll
          git init -q -b web-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web preview from $SOURCE_REF ($SOURCE_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-preview
