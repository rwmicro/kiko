name: Web preview

# Compile l'aperçu web (WebAssembly) et le publie sur la branche `web-preview`,
# d'où il peut être affiché dans Claude ou servi par GitHub Pages.
on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the web preview
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace
      - name: Push to the web-preview branch
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd composeApp/build/dist/wasmJs/productionExecutable
          touch .nojekyll
          git init -q -b web-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web preview from $SOURCE_REF ($SOURCE_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-preview
