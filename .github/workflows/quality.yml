name: Qualité du code

# Formatage (ktlint) et analyse (detekt), lancés en ligne de commande pour ne pas
# toucher au build Gradle. Les remarques remontent dans Security > Code scanning.
# - detekt est bloquant pour tout NOUVEAU problème : ceux déjà présents sont listés
#   dans config/detekt/baseline.xml et seront nettoyés au fil de l'eau.
# - ktlint (formatage pur, sans enjeu de sécurité) reste en mode conseil.
on:
  pull_request:
    paths: ["**/*.kt", "**/*.kts", ".editorconfig", "config/detekt/**", ".github/workflows/quality.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  KTLINT_VERSION: "1.5.0"
  DETEKT_VERSION: "1.23.8"

jobs:
  ktlint:
    name: Formatage (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Installer ktlint
        run: |
          curl -sSLo ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
      - name: Vérifier le formatage
        run: ./ktlint "**/src/**/*.kt" "*.kts" "**/*.kts" --reporter=plain --reporter=sarif,output=ktlint.sarif || true
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        if: always()
        with:
          sarif_file: ktlint.sarif
          category: ktlint

  detekt:
    name: Analyse (detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Installer detekt
        run: |
          curl -sSLo detekt.zip "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          unzip -q detekt.zip
      - name: Analyser le code partagé et Android
        run: |
          status=0
          ./detekt-cli-${DETEKT_VERSION}/bin/detekt-cli \
            --input composeApp/src,androidApp/src \
            --config config/detekt/detekt.yml \
            --build-upon-default-config \
            --baseline config/detekt/baseline.xml \
            --report sarif:detekt.sarif \
            --report txt:detekt.txt || status=$?
          cat detekt.txt || true
          if [ "$status" != 0 ]; then
            echo "::error::detekt a trouvé de nouveaux problèmes (liste ci-dessus). Corrige-les, ou justifie-les avec @Suppress."
          fi
          exit $status
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        if: always()
        with:
          sarif_file: detekt.sarif
          category: detekt
