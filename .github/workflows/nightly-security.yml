name: Sécurité de nuit (scan dynamique et fuzzing)

# Attaque un VRAI serveur : à lancer uniquement contre l'environnement de TEST
# (le projet Supabase du prototype, devenu l'environnement de test), jamais contre la production.
#
# Désactivé tant que la variable de dépôt STAGING_SUPABASE_URL n'est pas définie
# (Settings > Secrets and variables > Actions > Variables), avec le secret
# STAGING_SUPABASE_KEY (clé publiable du projet de test).
on:
  schedule:
    - cron: "0 2 * * *" # chaque nuit à 2 h UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap:
    name: Scan dynamique de l'API (OWASP ZAP)
    if: vars.STAGING_SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with:
          target: ${{ vars.STAGING_SUPABASE_URL }}/rest/v1/?apikey=${{ secrets.STAGING_SUPABASE_KEY }}
          format: openapi
          fail_action: false
          issue_title: "Scan ZAP de nuit"

  fuzz-api:
    name: Fuzzing de l'API (Schemathesis)
    if: vars.STAGING_SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Envoyer des entrées malformées à chaque point d'entrée
        env:
          URL: ${{ vars.STAGING_SUPABASE_URL }}
          KEY: ${{ secrets.STAGING_SUPABASE_KEY }}
        run: |
          pip install --quiet schemathesis
          schemathesis run "$URL/rest/v1/?apikey=$KEY" \
            --header "apikey: $KEY" \
            --checks all \
            --max-examples 50 \
            --report junit --report-junit-path schemathesis.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: schemathesis-report
          path: schemathesis.xml
