name: Publication mobile

# Construit, signe et envoie les apps sur les stores.
#
#   fusion sur main → app de TEST (base staging) : piste « test interne » Play + TestFlight interne
#   tag v*          → app de PRODUCTION (base prod), après approbation : Play en déploiement
#                     progressif (10 %, à élargir à la main dans la Play Console) + TestFlight,
#                     d'où la version est soumise à Apple.
#
# Chaque binaire reçoit une attestation de provenance signée (qui l'a construit, depuis quel commit).
# Tant que les secrets d'un store manquent dans l'environnement GitHub, son job est sauté (notice).
#
# Secrets et variables par environnement GitHub (staging et production), voir docs/publication-mobile.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android → Play (${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'test interne' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write # attestation de provenance
      attestations: write
    env:
      IS_PROD: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Secrets Play configurés ?
        id: configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PLAY" ]; then
            echo "::notice::Secrets Android absents de cet environnement : publication Play sautée."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.configured.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: steps.configured.outputs.ok == 'true'
        with:
          cache-read-only: true # un build de publication n'écrit pas dans le cache partagé
      - name: Construire et signer l'AAB
        if: steps.configured.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KIKO_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KIKO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KIKO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          export KIKO_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KIKO_UPLOAD_KEYSTORE"
          args=(-Pkiko.versionCode="$RUN_NUMBER")
          if [ "$IS_PROD" = "true" ]; then
            args+=(-Pkiko.env=prod -Pkiko.versionName="${REF_NAME#v}" -Pkiko.supabaseUrl="$SUPABASE_URL" -Pkiko.supabaseKey="$SUPABASE_KEY")
          fi
          ./gradlew :androidApp:bundleRelease "${args[@]}" --no-configuration-cache --stacktrace
          rm -f "$KIKO_UPLOAD_KEYSTORE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.configured.outputs.ok == 'true'
        with:
          subject-path: androidApp/build/outputs/bundle/release/*.aab
      - name: Envoyer sur Play
        if: steps.configured.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          track: ${{ env.IS_PROD == 'true' && 'production' || 'internal' }}
          status: ${{ env.IS_PROD == 'true' && 'inProgress' || 'completed' }}
          userFraction: ${{ env.IS_PROD == 'true' && '0.1' || '' }}

  ios:
    name: iOS → TestFlight (${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'test interne' }})
    runs-on: macos-15
    timeout-minutes: 75
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      IS_PROD: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Secrets App Store Connect configurés ?
        id: configured
        env:
          KEY: ${{ secrets.ASC_API_KEY_P8 }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$TEAM" ]; then
            echo "::notice::Secrets Apple absents de cet environnement : envoi TestFlight sauté."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.configured.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        if: steps.configured.outputs.ok == 'true'
        with:
          cache-read-only: true
      - name: Préparer la clé API App Store Connect
        if: steps.configured.outputs.ok == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"
          chmod 600 "$RUNNER_TEMP/asc_key.p8"
      - name: Choisir l'environnement Supabase du framework partagé
        if: steps.configured.outputs.ok == 'true' && env.IS_PROD == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Le script Xcode appelle Gradle lui-même : les propriétés de prod passent par le
          # gradle.properties de l'utilisateur, qui l'emporte sur celui du projet.
          mkdir -p ~/.gradle
          {
            echo "kiko.env=prod"
            echo "kiko.supabaseUrl=$SUPABASE_URL"
            echo "kiko.supabaseKey=$SUPABASE_KEY"
          } >> ~/.gradle/gradle.properties
      - name: Générer le projet Xcode
        if: steps.configured.outputs.ok == 'true'
        working-directory: iosApp
        run: brew install xcodegen && xcodegen generate
      - name: Archiver et signer
        if: steps.configured.outputs.ok == 'true'
        working-directory: iosApp
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="0.1.0"
          if [ "$IS_PROD" = "true" ]; then version="${REF_NAME#v}"; fi
          xcodebuild archive \
            -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kiko.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$RUN_NUMBER" MARKETING_VERSION="$version" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Exporter et envoyer sur TestFlight
        if: steps.configured.outputs.ok == 'true'
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kiko.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.configured.outputs.ok == 'true'
        with:
          subject-path: ${{ runner.temp }}/Kiko.xcarchive/Products/Applications/Kiko.app/Kiko
      - name: Effacer la clé API
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
