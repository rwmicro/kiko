name: Sécurité

# Contrôles de sécurité rapides, à chaque pull request et chaque semaine.
# Les résultats arrivent dans l'onglet Security > Code scanning du dépôt.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # chaque lundi à 4 h UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets dans le code (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependencies:
    name: Dépendances vulnérables
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # pour le résumé en commentaire si la revue échoue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  semgrep:
    name: Analyse statique (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scanner Kotlin, SQL, workflows et secrets
        run: |
          semgrep scan \
            --config p/kotlin \
            --config p/secrets \
            --config p/github-actions \
            --config p/sql-injection \
            --sarif --output semgrep.sarif \
            --error --severity ERROR
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  mobile:
    name: Sécurité mobile (mobsfscan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Analyser le code Android et iOS
        # Bloquant : une alerte de gravité ERROR fait échouer la PR. Les faux positifs
        # connus sont listés, avec leur raison, dans .mobsf.
        # semgrep est nécessaire aux règles Kotlin et Swift de mobsfscan (sans lui, seul le manifeste est lu).
        run: |
          pip install --quiet mobsfscan semgrep
          mobsfscan --config .mobsf --sarif --output mobsfscan.sarif androidApp composeApp iosApp
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        if: always()
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan

  osv:
    name: Dépendances vulnérables (OSV-Scanner)
    # Compare les versions EXACTES des dépendances (transitives comprises) à la base
    # OSV.dev. Les alertes arrivent dans Security > Code scanning, catégorie osv-scanner.
    # Sur une PR, le contrôle « Code scanning results » ne signale que les failles
    # nouvelles par rapport à main : une faille publiée hier sur une dépendance déjà
    # présente ne bloque pas une PR sans rapport (elle apparaît dans l'onglet Security
    # et Dependabot propose la mise à jour).
    # Les exceptions justifiées se déclarent dans osv-scanner.toml, avec leur raison.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true
      - name: Lister les versions résolues (gradle.lockfile, non commités)
        # OSV-Scanner ne lit pas libs.versions.toml : voir le script pour le détail.
        run: |
          ./gradlew --init-script .github/osv-scanner/lock-all.init.gradle.kts \
            --no-configuration-cache osvResolveAndLockAll --write-locks --stacktrace
          find . -name gradle.lockfile -not -path "./.gradle/*" | tee lockfiles.txt
          if [ ! -s lockfiles.txt ]; then
            echo "::error::Aucun gradle.lockfile produit : OSV-Scanner n'aurait rien à analyser."
            exit 1
          fi
      - name: Scanner les dépendances
        # Code de sortie 1 = failles trouvées : on continue pour envoyer le rapport,
        # c'est Code scanning qui décide (nouvelles alertes seulement sur une PR).
        id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=sarif
            --output-file=osv-scanner.sarif
            --recursive
            ./
      - name: Vérifier que le scan a abouti
        # Toute autre erreur que « failles trouvées » (1) fait échouer le job.
        if: steps.scan.outcome == 'failure'
        run: |
          if [ ! -s osv-scanner.sarif ]; then
            echo "::error::OSV-Scanner n'a pas produit de rapport, voir l'étape précédente."
            exit 1
          fi
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        if: always() && hashFiles('osv-scanner.sarif') != ''
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner

  gradle-wrapper:
    name: Wrapper Gradle authentique
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vérifie que gradle/wrapper/gradle-wrapper.jar est un binaire officiel de Gradle,
      # et pas un jar modifié glissé dans une PR (il s'exécute sur chaque poste et en CI).
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

  codeql:
    name: CodeQL (workflows GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Kotlin 2.4 n'est pas encore garanti par l'extracteur CodeQL : le code Kotlin
      # est couvert par Semgrep et detekt. On ajoutera "javascript-typescript"
      # quand les Edge Functions arriveront dans supabase/functions.
      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          category: codeql-actions
