name: Déployer les fonctions Edge

# Lancement à la main (onglet Actions → « Déployer les fonctions Edge » → Run workflow).
# Secrets GitHub à créer une fois : SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens)
# et SUPABASE_PROJECT_REF (l'identifiant du projet, dans l'URL du tableau de bord).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer push et reminders
        working-directory: supabase
        run: |
          supabase functions deploy push --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --no-verify-jwt
          supabase functions deploy reminders --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --no-verify-jwt
