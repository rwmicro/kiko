version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin-et-compose:
        patterns: ["org.jetbrains*", "androidx*", "com.android*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
