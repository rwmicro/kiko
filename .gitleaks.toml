# Configuration Gitleaks : règles par défaut, plus des exceptions pour les identifiants
# publics par conception (livrés dans l'app et protégés côté serveur) :
#  - la clé publiable Supabase (règles d'accès de la base) ;
#  - les identifiants Firebase de l'app Android (androidApp/firebase.properties), qui ne
#    permettent pas d'envoyer de notifications : l'envoi demande le compte de service,
#    rangé seulement dans les secrets des fonctions Supabase.
[extend]
useDefault = true

[allowlist]
description = "Identifiants publics par conception"
regexes = ['''sb_publishable_[A-Za-z0-9_-]+''']
paths = ['''androidApp/firebase\.properties''']
